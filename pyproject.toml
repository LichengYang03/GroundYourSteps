[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gys"
version = "1.0.0"
description = "Ground Your Steps: offline schedule optimization for frozen VLA policies"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
robotwin = ["h5py>=3.8", "pillow>=10"]
lerobot = ["pyarrow>=14", "pillow>=10", "av>=12"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
gys = "gys.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gys = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
